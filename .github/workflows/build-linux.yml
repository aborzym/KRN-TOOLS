name: Build Linux DEB

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag wydania do zbudowania
        required: true
        default: v2.9.2
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      BUILD_TAG: ${{ inputs.tag }}

    steps:
      - name: Pobierz kod wydania
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Przygotuj Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Zainstaluj biblioteki systemowe
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libopengl0 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-image0 \
            libxcb-render-util0

      - name: Przygotuj środowiska
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
          .venv/bin/python -m pip install -e ".[dev]"
          python -m venv .venv-build
          .venv-build/bin/python -m pip install --upgrade pip setuptools wheel
          .venv-build/bin/python -m pip install pyinstaller -e .

      - name: Sprawdź zgodność wersji z tagiem
        run: |
          .venv/bin/python - <<'PY'
          import os
          import runpy

          version = runpy.run_path("src/spineworks/__init__.py")["__version__"]
          if os.environ["BUILD_TAG"] != f"v{version}":
              raise SystemExit("Tag nie odpowiada wersji aplikacji.")
          PY

      - name: Uruchom testy i zbuduj DEB
        run: bash packaging/build-release.sh

      - name: Sprawdź architekturę pakietu
        run: |
          package=(dist/SPINEWORKS-*-linux-x86_64.deb)
          test "${#package[@]}" -eq 1
          test "$(dpkg-deb -f "${package[0]}" Architecture)" = amd64
          dpkg-deb --info "${package[0]}"

      - name: Zachowaj pakiet i manifest
        uses: actions/upload-artifact@v6
        with:
          name: SPINEWORKS-linux-${{ inputs.tag }}
          path: |
            dist/SPINEWORKS-*-linux-x86_64.deb
            dist/SPINEWORKS-*-linux-x86_64.deb.build.json
          if-no-files-found: error
          retention-days: 14

      - name: Zachowaj log budowania
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-linux-${{ inputs.tag }}
          path: dist/build-*-linux-x86_64.log
          if-no-files-found: ignore
          retention-days: 14
